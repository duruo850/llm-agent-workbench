[pytest]
testpaths = .
python_files = *_test.py
python_functions = test_*
pythonpath = .
addopts = -ra -s
markers =
    bert: tests that require BERT model weights (slow / optional)
norecursedirs = .venv venv node_modules web .git __pycache__ .harness dist build data

# 全仓库递归发现 *_test.py；IDE 改配置后请「Python: Refresh Tests」。
# 仅 *_test.py 为测试文件；conftest.py / 业务模块不是测试。
