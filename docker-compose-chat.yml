# BillMind 纯聊天精简栈（无截图 / 无 RAG）
# 文本走 DeepSeek 云端；记账 CRUD 走 PostgreSQL。
#
# 不启：ollama、milvus、etcd、minio、knowledge-index
#
# 用法：
#   cp config.yaml.example config.docker.yaml   # 填 deepseek_api_key
#   # 建议在 config.docker.yaml 加：
#   #   intent_classifier: rule          # 不依赖 Ollama embedding
#   #   txn_search_incremental: false    # 不写向量库
#   docker compose -f docker-compose-chat.yml pull
#   docker compose -f docker-compose-chat.yml up -d
#
# 磁盘不够时勿 pull 全量 compose；先清未完成层：
#   docker system df
#   docker builder prune -af
#   docker image prune -af
#   sudo journalctl --vacuum-size=100M   # 可选

services:
  postgres:
    image: postgres:16-alpine
    container_name: billmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billmind
      POSTGRES_PASSWORD: billmind
      POSTGRES_DB: billmind
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billmind -d billmind"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - billmind

  server:
    image: duruo850/billmind-server:latest
    container_name: billmind-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - billmind

  web:
    image: duruo850/billmind-web:latest
    container_name: billmind-web
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./web/my.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
    networks:
      - billmind

networks:
  billmind:
    driver: bridge
